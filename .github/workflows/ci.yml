# Runs Prettier, ESLint, the tests and the build on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    # Placeholder values. The build fails without them because
    # lib/supabase-env.js throws at module load. The publishable key is
    # public by design, so these are not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Install exactly the versions package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # Read-only check. It reports unformatted files and never rewrites them.
      - name: Check formatting
        run: npm run format:check

      # Skips any workspace package that has no lint script.
      - name: Lint
        run: npm run lint

      # Skips any workspace package that has no test script.
      - name: Test
        run: npm test

      # Skips any workspace package that has no build script.
      - name: Build
        run: npm run build --workspaces --if-present
